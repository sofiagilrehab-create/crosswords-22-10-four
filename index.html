    // WEB AUDIO API SYNTHESIZER (NO EXTERNAL AUDIO FILES REQUIRED)
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'tap') {
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'correct') {

        // Fallback for audio restrictions
      }

    // DIRECT CLEVERTOUCH TOUCH/POINTER ATTACHMENT HELPER
    function attachTouchHandler(element, callback) {
      if (!element) return;
      let handled = false;

      const handleTouch = (e) => {
        e.preventDefault();
        e.stopPropagation();
        handled = true;
        initAudio();
        callback(e);
        setTimeout(() => { handled = false; }, 250);
      };

      element.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch' || e.pointerType === 'pen') {
          handleTouch(e);
        }
      }, { passive: false });

      element.addEventListener('click', (e) => {
        if (!handled) {
          initAudio();
          callback(e);
        }
      });
    }

      document.getElementById('card-search').addEventListener('input', renderCards);
    }

    function switchTab(tab) {
      playSound('tap');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));

      if (tab === 'quiz') {
        document.getElementById('tab-quiz').classList.add('active');
        document.getElementById('quiz-view').classList.add('active');
      } else {
        document.getElementById('tab-cards').classList.add('active');
        document.getElementById('cards-view').classList.add('active');
      }
    }

    // ==========================================================================
    // MODE 1: INTERACTIVE QUIZ ENGINE
    // ==========================================================================
    function loadQuizClue(index) {
      const item = PUZZLE_DATA[index];
      document.getElementById('quiz-badge').innerText = `${item.dir.toUpperCase()} #${item.num}`;
      document.getElementById('quiz-progress').innerText = `Clue ${index + 1} of ${PUZZLE_DATA.length}`;
      document.getElementById('quiz-clue').innerText = `"${item.clue}"`;
      document.getElementById('quiz-length').innerText = `${item.len} Letters`;

      // Reset guess state for new clue
      quizUserGuess = [];
      for (let i = 0; i < item.ans.length; i++) {
        if (item.ans[i] === ' ') {
          quizUserGuess.push(' ');
        } else {
          quizUserGuess.push('');
        }
      }

      renderQuizSlots();
    }

    function renderQuizSlots() {
      const container = document.getElementById('quiz-slots');
      container.innerHTML = '';
      const item = PUZZLE_DATA[currentQuizIndex];

      for (let i = 0; i < item.ans.length; i++) {
        const slot = document.createElement('div');
        const char = quizUserGuess[i] || '';

        if (item.ans[i] === ' ') {
          slot.className = 'letter-slot space';
        } else {
          slot.className = `letter-slot ${char ? 'filled' : ''}`;
          slot.innerText = char;
        }

        container.appendChild(slot);
      }
    }

    function handleKeyInput(key) {
      playSound('tap');
      const item = PUZZLE_DATA[currentQuizIndex];

      if (key === 'BACK') {
        for (let i = quizUserGuess.length - 1; i >= 0; i--) {
          if (item.ans[i] !== ' ' && quizUserGuess[i] !== '') {
            quizUserGuess[i] = '';
            break;
          }
        }
      } else {
        for (let i = 0; i < quizUserGuess.length; i++) {
          if (item.ans[i] !== ' ' && quizUserGuess[i] === '') {
            quizUserGuess[i] = key;
            break;
          }
        }
      }

      renderQuizSlots();

      // Check for completion
      if (quizUserGuess.join('') === item.ans) {
        playSound('correct');
        userScore += 50;
        document.getElementById('quiz-score').innerText = `${userScore} PTS`;
        setTimeout(() => {
          nextQuizClue();
        }, 1000);
      }
    }

    function prevQuizClue() {
      playSound('tap');
      currentQuizIndex = (currentQuizIndex - 1 + PUZZLE_DATA.length) % PUZZLE_DATA.length;
      loadQuizClue(currentQuizIndex);
    }

    function nextQuizClue() {
      playSound('tap');
      currentQuizIndex = (currentQuizIndex + 1) % PUZZLE_DATA.length;
      loadQuizClue(currentQuizIndex);
    }

    function randomQuizClue() {
      playSound('tap');
      currentQuizIndex = Math.floor(Math.random() * PUZZLE_DATA.length);
      loadQuizClue(currentQuizIndex);
    }

    function revealQuizHint() {
      playSound('tap');
      const item = PUZZLE_DATA[currentQuizIndex];

      for (let i = 0; i < item.ans.length; i++) {
        if (quizUserGuess[i] !== item.ans[i]) {
          quizUserGuess[i] = item.ans[i];
          break;
        }
      }
      userScore = Math.max(0, userScore - 10);
      document.getElementById('quiz-score').innerText = `${userScore} PTS`;
      renderQuizSlots();

      if (quizUserGuess.join('') === item.ans) {
        playSound('correct');
      }
    }

    function revealQuizAnswer() {
      playSound('reveal');
      const item = PUZZLE_DATA[currentQuizIndex];
      quizUserGuess = item.ans.split('');
      renderQuizSlots();
    }

    function clearQuizGuess() {
      playSound('tap');
      const item = PUZZLE_DATA[currentQuizIndex];
      quizUserGuess = [];
      for (let i = 0; i < item.ans.length; i++) {
        quizUserGuess.push(item.ans[i] === ' ' ? ' ' : '');
      }
      renderQuizSlots();
    }

    // CLEVERTOUCH OVERSIZED VIRTUAL KEYBOARD RENDERER
    function renderKeyboard() {
      const container = document.getElementById('quiz-keyboard');
      container.innerHTML = '';

      const layout = [
        ['Q','W','E','R','T','Y','U','I','O','P'],
        ['A','S','D','F','G','H','J','K','L'],
        ['Z','X','C','V','B','N','M','BACK']
      ];

      layout.forEach(row => {
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';

        row.forEach(key => {
          const btn = document.createElement('button');
          const isBack = key === 'BACK';
          btn.className = `key-btn ${isBack ? 'wide' : ''}`;
          btn.innerText = isBack ? '⌫ ERASE' : key;

          attachTouchHandler(btn, () => handleKeyInput(key));
          rowEl.appendChild(btn);
        });

        container.appendChild(rowEl);
      });
    }

    // ==========================================================================
    // MODE 2: GIANT CLUE CARDS ENGINE
    // ==========================================================================
    function setCardFilter(filter) {
      playSound('tap');
      activeCardFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`filter-${filter}`).classList.add('active');
      renderCards();
    }

    function toggleCardReveal(index) {
      playSound('tap');
      if (revealedCards.has(index)) {
        revealedCards.delete(index);
      } else {
        revealedCards.add(index);
      }
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      const query = document.getElementById('card-search').value.toLowerCase().trim();
      container.innerHTML = '';

      PUZZLE_DATA.forEach((item, index) => {
        if (activeCardFilter !== 'all' && item.dir !== activeCardFilter) return;
        if (query && !item.clue.toLowerCase().includes(query) && !item.num.toString().includes(query)) return;

        const isRevealed = revealedCards.has(index);
        const card = document.createElement('div');
        card.className = `clue-card ${item.dir}`;

        attachTouchHandler(card, () => toggleCardReveal(index));

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="card-num">${item.num}</span>
              <span class="card-dir">${item.dir}</span>
            </div>
            <div class="card-clue-text">"${item.clue}"</div>
          </div>
          <div class="card-ans-box ${isRevealed ? '' : 'hidden'}">
            ${isRevealed ? item.ans : '👆 TAP TO REVEAL ANSWER'}
          </div>
        `;

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
